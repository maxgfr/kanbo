name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # The same gate CI runs, run again here rather than assumed.
  #
  # Deploy fires on its own triggers, and a workflow cannot read another
  # workflow's result without either coupling their triggers or trusting that
  # one happened to pass. Publishing an image built from code that never went
  # through `verify` is exactly the kind of thing nobody notices until the
  # image is what someone is running.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

  pages:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GitHub Pages serves this repo from /kanbo/.
      - run: pnpm build
        env:
          KANBO_BASE: /kanbo/
      # Run again despite `verify` above, because this build is a different one:
      # it carries KANBO_BASE, and the artifact that gets deployed is the one
      # whose policies have to be checked.
      # check:network now asserts things about the published bins too, so they
      # have to exist before it runs.
      - run: pnpm build:dist
      - run: pnpm check:network
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist
      - id: deploy
        uses: actions/deploy-pages@v4

  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
