name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck, lint, format, tests, build, and the network boundary guard.
      # The guard needs the build to have run, which is why it comes last.
      - run: pnpm verify
        env:
          # The smoke checks drive the Chrome preinstalled on the runner.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

  # The package claims engines >= 22. esbuild transpiles syntax but cannot see a
  # dependency calling an API that does not exist on 22, so the floor is only
  # true if something runs there. This is the only job that makes it so.
  #
  # Note the asymmetry: developing this repository needs Node >= 22.18, because
  # every script is a .ts file run by type stripping. The published bundle needs
  # no stripping at all, which is why >= 22 is honest for the package.
  dist:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:dist
      - run: pnpm check:dist
