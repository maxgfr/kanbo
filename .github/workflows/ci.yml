name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck, lint, format, tests, build, and the network boundary guard.
      # The guard needs the build to have run, which is why it comes last.
      - run: pnpm verify
        env:
          # The smoke checks drive the Chrome preinstalled on the runner.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
