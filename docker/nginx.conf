server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Deliberately no Content-Security-Policy header. The policy lives in each
  # document's <meta>, so both documents keep their own — and a header here
  # would apply one policy to both, collapsing the distinction the whole
  # design rests on.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed assets are immutable; the documents must never be, or a user could
  # keep loading a policy we have since tightened.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /connect.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
